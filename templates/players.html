{% extends "base.html" %}

{% block title %}Players — MFP Stats{% endblock %}

{% block content %}
    <h1>Players</h1>

    <div class="year-filter-bar">
        <input type="search" id="player-search" placeholder="Search for a player..." onkeyup="filterPlayers()" style="width: 300px; max-width: 100%;">
    </div>

    <ul id="player-list">
        {% for player in players %}
            <li><a href="player_{{ player.playerId }}.html">{{ player.name }}</a></li>
        {% endfor %}
    </ul>

    <script>
        function filterPlayers() {
            let filter = document.getElementById('player-search').value.toUpperCase();
            let li = document.getElementById('player-list').getElementsByTagName('li');
            for (let i = 0; i < li.length; i++) {
                let a = li[i].getElementsByTagName("a")[0];
                let txt = a.textContent || a.innerText;
                li[i].style.display = txt.toUpperCase().indexOf(filter) > -1 ? "" : "none";
            }
        }
    </script>
{% endblock %}
